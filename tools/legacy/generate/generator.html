<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Generative Art Workspace</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#F3F7F6;--pn:#fff;--tx:#193438;--mu:#526C6E;--ln:#DEE7E5;--ct:#A7BFC0;--ac:#236F72;--acp:#19595C;--sa:#DCEFEB;--sh:#EAF1EF;--st:#182D30;--sf:"Instrument Sans",Inter,system-ui,sans-serif;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1A1B;--pn:#162426;--tx:#E6F0EF;--mu:#9DB3B4;--ln:#2A3D3F;--ct:#3F5A5C;--ac:#3E9A9D;--acp:#2F8285;--sa:#21403F;--sh:#1C3234;--st:#0A1314}}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:400 14px/1.45 var(--sf)}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;min-height:56px;padding:8px 16px;border-bottom:1px solid var(--ln);background:var(--pn)}
h1{font:600 20px/1.25 var(--sf);letter-spacing:-.015em;margin:0 12px 0 0}
main{display:grid;grid-template-columns:240px 1fr 340px;gap:0;min-height:calc(100vh - 56px)}
aside,section{padding:16px;min-width:0}aside{background:var(--pn);overflow-y:auto;max-height:calc(100vh - 56px)}section{background:var(--bg);overflow-y:auto;max-height:calc(100vh - 56px)}
#L{border-right:1px solid var(--ln)}#R{border-left:1px solid var(--ln)}
h2{font:600 15px/1.35 var(--sf);color:var(--tx);margin:0 0 12px}
h3{font:600 13px/1.3 var(--sf);color:var(--tx);margin:0}
select,input[type=text],input[type=range],input[type=color],textarea,button{font:500 13px/1.3 var(--sf);color:var(--tx);background:var(--pn);border:1px solid var(--ct);border-radius:8px;padding:0 10px;min-height:34px}
textarea{padding:6px 10px;resize:vertical}
input[type=color]{padding:2px 4px;height:34px;cursor:pointer}
button{cursor:pointer}button:hover{background:var(--sh)}button.p{background:var(--ac);color:#fff;border-color:var(--ac)}button.p:hover{background:var(--acp)}
button:disabled{opacity:0.4;cursor:not-allowed}
label.c{display:flex;flex-direction:column;gap:4px;margin-bottom:10px;font:500 12px/1.4 var(--sf);color:var(--mu)}
label.c select,label.c input[type=range]{width:100%}
.as{display:flex;gap:6px;align-items:center;padding:6px 0;border-bottom:1px solid var(--ln)}
.as input[type=text]{flex:1;min-width:0}.as small{color:var(--mu);flex:1}
.seg{display:inline-flex;border:1px solid var(--ct);border-radius:8px;overflow:hidden}
.seg button{border:0;border-radius:0;min-height:34px}.seg button.on{background:var(--sa);color:var(--tx);font-weight:600}
.var{border:2px solid transparent;border-radius:10px;padding:12px;margin-bottom:16px;background:var(--st);color:#fff;cursor:pointer;transition:border-color 0.15s ease}
.var.sel{border-color:var(--ac)}
.var h3{margin:0 0 8px;font:500 12px/1.4 var(--sf);display:flex;justify-content:space-between;color:#fff}
.row{display:flex;gap:12px;overflow-x:auto}
.slide{position:relative;width:200px;aspect-ratio:4/5;flex:none;overflow:hidden;container-type:inline-size;border-radius:6px;cursor:pointer;box-shadow:0 4px 16px rgba(0,0,0,0.25)}
.slide.big{width:260px}
.slide.active-slide{box-shadow:0 0 0 2px var(--ac),0 8px 24px rgba(0,0,0,0.35)}
.poster-bg{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.poster-bg-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center;display:block}
.poster-scrim{position:absolute;inset:0;pointer-events:none}
.poster-fallback-bg{position:absolute;inset:0;width:100%;height:100%}
.poster-no-img-badge{position:absolute;top:6px;left:6px;padding:2px 6px;border-radius:3px;background:rgba(0,0,0,0.65);color:#cbd5e1;font:500 8.5px monospace;letter-spacing:0.04em}
.tex,.acc{position:absolute;inset:0;pointer-events:none}
.acc{z-index:4}
.tex{z-index:9}
.el{position:absolute;line-height:1.02;white-space:pre-line;cursor:pointer;user-select:none;transition:outline 0.1s ease;z-index:3}
.el:hover{outline:1.5px dashed #236F72;outline-offset:2px}
.el.selected-el{outline:2px solid #236F72 !important;outline-offset:3px !important;box-shadow:0 0 0 3px #DCEFEB !important;z-index:9999 !important}
.sph{border-radius:50%;aspect-ratio:1}
.ring{border-radius:50%;aspect-ratio:1;animation:sp 8s linear infinite}
@keyframes sp{to{rotate:360deg}}
.mo{animation:dr 9s ease-in-out infinite alternate}@keyframes dr{to{background-position:100% 100%}}
#st{font-size:12px;color:var(--mu);margin:0 0 10px;padding:6px 10px;background:var(--pn);border-radius:6px;border:1px solid var(--ln)}
.props-card{background:var(--sh);border:1px solid var(--ln);border-radius:8px;padding:12px;margin-bottom:16px}
.props-card h3{margin:0 0 8px;display:flex;align-items:center;justify-content:space-between;font-size:13px}
.props-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.props-btn-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.props-btn-row button{flex:1;min-height:30px;font-size:11px;padding:0 6px}
.badge{display:inline-block;padding:2px 6px;border-radius:4px;font-size:10px;font-weight:600;background:var(--sa);color:var(--acp)}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;z-index:10000;backdrop-filter:blur(2px)}
.modal-card{background:var(--pn);color:var(--tx);border:1px solid var(--ln);border-radius:12px;padding:20px;max-width:380px;width:90%;box-shadow:0 12px 32px rgba(0,0,0,0.2)}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
@media (max-width:820px){main{grid-template-columns:1fr}#L,#R{border:0}}
</style></head><body>
<header><h1>Generative Art</h1>
<div class="seg" id="fmt"></div><span id="slw"></span>
<div class="seg" id="mode"></div>
<button class="p" id="regen">Regenerate</button><button id="exp">Export spec</button></header>
<main>
<aside id="L"><h2>Assets</h2><div id="al"></div>
<div style="margin-top:10px;display:flex;gap:6px;flex-wrap:wrap"><button id="addT">+ Text</button><button id="addI">+ Image</button><input type="file" id="fi" accept="image/*" hidden></div>
<p style="color:var(--mu);font-size:11px;margin-top:12px"><b>Poster Rule:</b> Photo is always the full-bleed background. Typography, 3D and vectors are composed over it.</p></aside>
<section><p id="st"></p><div id="C"></div></section>
<aside id="R">
<div id="props-panel"></div>
<h2>Creative controls</h2><div id="ct"></div>
</aside>
</main>
<div id="confirm-modal" class="modal-overlay">
  <div class="modal-card">
    <h3>Discard manual edits?</h3>
    <p style="color:var(--mu);font-size:13px;margin:8px 0 0">You have made manual edits to this composition. Regenerating will create new compositions and discard your manual changes.</p>
    <div class="modal-actions">
      <button id="modal-cancel">Cancel</button>
      <button id="modal-confirm" class="p">Discard & Regenerate</button>
    </div>
  </div>
</div>
<script>
const OPT={
style:['Editorial','Minimalist','Experimental','Swiss'],
layout:['Auto (mix)','Grid-based','Centered','Dynamic / asymmetrical','Layered / overlapping'],
hierarchy:['Typography-led','3D / image-led','Balanced'],
negative:['Generous margins','Balanced','Tight / packed'],
colour:['Preserve original','Monochrome','Complementary','High contrast','Generate new palette'],
accents:['None','Lines & borders','Geometric shapes','Small marks','Frames & dividers'],
texture:['None','Film grain','Paper','Noise','Distressed'],
freedom:['Conservative','Balanced','Experimental'],
variations:['3','2','1']};
const CTL_LABELS={
layout:'Composition strategy',
style:'Visual style',
hierarchy:'Visual hierarchy',
negative:'Negative space',
colour:'Colour treatment',
accents:'Graphic accents',
texture:'Texture',
freedom:'Creative freedom',
variations:'Number of variations'};
const S={fmt:'post',slides:3,mode:'rules',seed:1,sel:0,activeSlide:0,selectedId:null,vars:[],edits:{},history:{undo:[],redo:[]},gen:0,
ctl:{style:'Editorial',layout:'Auto (mix)',hierarchy:'Balanced',negative:'Balanced',overlap:50,colour:'Preserve original',accents:'Lines & borders',texture:'Film grain',freedom:'Balanced',variations:'3'},
assets:[{id:'a1',type:'text',role:'head',text:'Make it\nloud',on:1},{id:'a2',type:'text',role:'sub',text:'Issue 04 · Autumn 2026',on:1},{id:'a3',type:'obj',name:'3D sphere',on:1},{id:'a4',type:'img',name:'Photo (Background)',src:null,on:1},{id:'a5',type:'vec',name:'Vector burst',on:1},{id:'a6',type:'motion',name:'Motion ring',on:1}]};
const $=s=>document.querySelector(s);
const rngF=a=>()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const LAY=['Grid-based','Centered','Dynamic / asymmetrical','Layered / overlapping'];
/* ---------- palette & color grading ---------- */
function pal(c,seed){
const r=rngF(seed*7+3),h=Math.floor(r()*360);
if(c.colour==='Monochrome')return{b1:'#111',b2:'#1a1a1a',fg:'#ffffff',sub:'#cbd5e1',a1:'#e2e8f0',a2:'#94a3b8',grade:'filter:grayscale(100%) contrast(120%) brightness(0.85);',scrim:'linear-gradient(180deg,rgba(0,0,0,0.35) 0%,rgba(10,10,10,0.85) 100%)'};
if(c.colour==='Complementary')return{b1:'#0b1523',b2:'#152238',fg:'#ffffff',sub:'#fef08a',a1:'#fbbf24',a2:'#f59e0b',grade:'filter:contrast(115%) brightness(0.75) hue-rotate(-20deg);',scrim:'linear-gradient(180deg,rgba(11,21,35,0.4) 0%,rgba(7,14,24,0.88) 100%)'};
if(c.colour==='High contrast')return{b1:'#000',b2:'#050505',fg:'#facc15',sub:'#ffffff',a1:'#facc15',a2:'#38bdf8',grade:'filter:contrast(135%) brightness(0.68);',scrim:'linear-gradient(180deg,rgba(0,0,0,0.45) 0%,rgba(0,0,0,0.92) 100%)'};
if(c.colour==='Generate new palette')return{b1:`hsl(${h} 40% 12%)`,b2:`hsl(${h} 45% 8%)`,fg:'#ffffff',sub:`hsl(${h} 75% 85%)`,a1:`hsl(${h} 85% 65%)`,a2:`hsl(${(h+180)%360} 85% 60%)`,grade:`filter:contrast(110%) brightness(0.8);`,scrim:`linear-gradient(180deg,hsla(${h},35%,12%,0.35) 0%,hsla(${h},45%,8%,0.88) 100%)`};
return{b1:'#193438',b2:'#0F1F21',fg:'#ffffff',sub:'#CFE4E1',a1:'#8FD6CF',a2:'#236F72',grade:'filter:contrast(105%) brightness(0.85);',scrim:'linear-gradient(180deg,rgba(0,0,0,0.2) 0%,rgba(0,0,0,0.4) 40%,rgba(0,0,0,0.75) 100%)'};
}
/* ---------- rule engine (foreground poster elements) ---------- */
const BASE={head:70,sub:55,obj:38,vec:26,motion:30},FOC={head:86,obj:64};
const AR={head:.48,sub:.14,obj:1,img:1.25,vec:1,motion:1};
const kind=a=>a.type==='text'?a.role||'sub':a.type;
function rules(assets,c,rng,si,layout){
const fg=assets.filter(a=>a.on&&kind(a)!=='img');
if(!fg.length)return[];
const style=c.style||'Editorial';
const fr=c.freedom==='Conservative'?0:c.freedom==='Balanced'?1:2;
let m=style==='Minimalist'?18:style==='Swiss'?7:style==='Editorial'?8:5;
if(c.negative==='Generous margins')m=Math.max(m,16);
else if(c.negative==='Tight / packed')m=Math.min(m,6);

const find=t=>fg.find(a=>kind(a)===t);
const headAsset=find('head'),subAsset=find('sub'),objAsset=find('obj'),vecAsset=find('vec');
let foc=headAsset;
if(c.hierarchy==='3D / image-led')foc=objAsset||headAsset;
else if(c.hierarchy==='Balanced')foc=(si===1?objAsset:headAsset);

const P=fg.map(a=>{
const k=kind(a),isF=a===foc;
let w=32;
if(style==='Editorial'){
if(k==='head')w=84;else if(k==='sub')w=62;else if(k==='obj')w=46;else if(k==='vec')w=26;else w=28;
}else if(style==='Minimalist'){
if(k==='head')w=64;else if(k==='sub')w=44;else if(k==='obj')w=34;else if(k==='vec')w=22;else w=24;
}else if(style==='Experimental'){
if(k==='head')w=96;else if(k==='sub')w=48;else if(k==='obj')w=58;else if(k==='vec')w=36;else w=34;
}else if(style==='Swiss'){
if(k==='head')w=82;else if(k==='sub')w=56;else if(k==='obj')w=44;else if(k==='vec')w=30;else w=28;
}
if(isF&&style!=='Minimalist')w=Math.min(98,w*1.12);
if(fr===2&&style==='Experimental')w*=0.9+rng()*0.25;
w=Math.min(w,100-m*1.1);
return{a,k,id:a.id,w,h:w*AR[k],x:50,y:62,r:0,z:{head:5,sub:4,obj:3,vec:2,motion:2}[k]+(isF?2:0),isF};
});

const n=P.length;
const head=P.find(p=>p.k==='head');
const sub=P.find(p=>p.k==='sub');
const obj=P.find(p=>p.k==='obj');
const vec=P.find(p=>p.k==='vec');
const others=P.filter(p=>p.k!=='head'&&p.k!=='sub'&&p.k!=='obj'&&p.k!=='vec');

if(style==='Editorial'){
if(si===0){
if(head){head.x=m+head.w/2;head.y=m+head.h/2+10;head.r=0}
if(sub){sub.x=m+sub.w/2;sub.y=125-m-sub.h/2-8;sub.r=0}
if(obj){obj.x=100-m-obj.w/2+2;obj.y=head?head.y+head.h/2+obj.h/2+4:65;obj.r=0;obj.z=2}
if(vec){vec.x=100-m-vec.w/2;vec.y=125-m-vec.h/2-8;vec.r=0}
}else if(si===1){
if(obj){obj.x=65;obj.y=m+obj.h/2+12;obj.r=0}
if(head){head.x=m+head.w/2;head.y=68;head.r=0}
if(sub){sub.x=m+sub.w/2;sub.y=125-m-sub.h/2-6;sub.r=0}
if(vec){vec.x=100-m-vec.w/2;vec.y=125-m-vec.h/2-6;vec.r=0}
}else{
if(head){head.x=m+head.w/2;head.y=48;head.r=0}
if(sub){sub.x=m+sub.w/2;sub.y=78;sub.r=0}
if(obj){obj.x=100-m-obj.w/2;obj.y=125-m-obj.h/2-6;obj.r=0}
if(vec){vec.x=100-m-vec.w/2;vec.y=m+vec.h/2+10;vec.r=0}
}
others.forEach((p,idx)=>{p.x=50+(idx%2?22:-22);p.y=65+idx*16;p.r=0});

}else if(style==='Minimalist'){
if(si===0){
if(head){head.x=50;head.y=45;head.r=0}
if(sub){sub.x=50;sub.y=125-m-sub.h/2-10;sub.r=0}
if(obj){obj.x=50;obj.y=80;obj.r=0}
if(vec){vec.x=50;vec.y=m+vec.h/2+8;vec.r=0}
}else if(si===1){
if(obj){obj.x=50;obj.y=58;obj.r=0}
if(head){head.x=50;head.y=m+head.h/2+10;head.r=0}
if(sub){sub.x=50;sub.y=125-m-sub.h/2-8;sub.r=0}
if(vec){vec.x=50;vec.y=96;vec.r=0}
}else{
if(head){head.x=50;head.y=52;head.r=0}
if(sub){sub.x=50;sub.y=75;sub.r=0}
if(obj){obj.x=50;obj.y=m+obj.h/2+10;obj.r=0}
if(vec){vec.x=50;vec.y=125-m-vec.h/2-8;vec.r=0}
}
others.forEach((p,idx)=>{p.x=50;p.y=62+(idx%2?26:-26);p.r=0});

}else if(style==='Experimental'){
const angle=(si%2===0?-6:7);
if(head){head.x=50+(si===0?-2:4);head.y=36+(si*8);head.r=angle;head.z=5}
if(obj){obj.x=64+(si===1?-15:0);obj.y=70+(si===0?0:-8);obj.r=-angle*1.5;obj.z=6}
if(sub){sub.x=36;sub.y=92-(si*6);sub.r=-angle;sub.z=4}
if(vec){vec.x=24;vec.y=55;vec.r=angle*2.5;vec.z=3}
others.forEach((p,idx)=>{p.x=50+(idx%2?28:-28);p.y=60+idx*22;p.r=(idx%2?12:-12)});

}else if(style==='Swiss'){
const colLeft=m+(head?head.w/2:35);
if(si===0){
if(head){head.x=m+head.w/2;head.y=m+head.h/2+6;head.r=0}
if(sub){sub.x=m+sub.w/2;sub.y=m+(head?head.h:20)+sub.h/2+18;sub.r=0}
if(obj){obj.x=100-m-obj.w/2;obj.y=125-m-obj.h/2-8;obj.r=0}
if(vec){vec.x=100-m-vec.w/2;vec.y=m+vec.h/2+14;vec.r=0}
}else if(si===1){
if(head){head.x=100-m-head.w/2;head.y=m+head.h/2+6;head.r=0}
if(sub){sub.x=100-m-sub.w/2;sub.y=m+(head?head.h:20)+sub.h/2+18;sub.r=0}
if(obj){obj.x=m+obj.w/2;obj.y=125-m-obj.h/2-8;obj.r=0}
if(vec){vec.x=m+vec.w/2;vec.y=65;vec.r=0}
}else{
if(head){head.x=m+head.w/2;head.y=44;head.r=0}
if(sub){sub.x=m+sub.w/2;sub.y=68;sub.r=0}
if(obj){obj.x=100-m-obj.w/2;obj.y=125-m-obj.h/2-8;obj.r=0}
if(vec){vec.x=100-m-vec.w/2;vec.y=m+vec.h/2+8;vec.r=0}
}
others.forEach((p,idx)=>{p.x=colLeft;p.y=75+idx*16;p.r=0});
}

const ovVal=typeof c.overlap==='number'?c.overlap:50;
const k=style==='Experimental'?(ovVal<=33?0.1:-0.4):style==='Minimalist'?1.2:(ovVal<=33?0.8:ovVal<=66?0.15:-0.2);
const lo=style==='Experimental'?-4:m,hiX=style==='Experimental'?104:100-m,hiY=style==='Experimental'?129:125-m;
if(style!=='Swiss'&&style!=='Editorial'){
for(let it=0;it<40;it++){for(let i=0;i<n;i++)for(let j=i+1;j<n;j++){const a=P[i],b=P[j],dx=b.x-a.x,dy=b.y-a.y,ox=(a.w+b.w)/2-Math.abs(dx),oy=(a.h+b.h)/2-Math.abs(dy);
if(k>0&&ox>0&&oy>0){const f=k*.06;if(ox<oy){const s=Math.sign(dx)||1;a.x-=s*ox*f;b.x+=s*ox*f}else{const s=Math.sign(dy)||1;a.y-=s*oy*f;b.y+=s*oy*f}}
else if(k<0&&(Math.abs(dx)>a.w*.3||Math.abs(dy)>a.h*.3)){a.x+=dx*.012;b.x-=dx*.012;a.y+=dy*.012;b.y-=dy*.012}}}
P.forEach(p=>{p.x=Math.max(lo+p.w/2,Math.min(hiX-p.w/2,p.x));p.y=Math.max(lo+p.h/2,Math.min(hiY-p.h/2,p.y))});
}
return P.map(p=>({id:p.id,x:+p.x.toFixed(1),y:+p.y.toFixed(1),w:+p.w.toFixed(1),r:+p.r.toFixed(1),z:p.z}))}
/* ---------- effective placements (dual-state) ---------- */
function getEffective(vIdx,sIdx,p){
const ov=S.edits&&S.edits[vIdx]&&S.edits[vIdx][sIdx]&&S.edits[vIdx][sIdx][p.id];
return ov?Object.assign({},p,ov):Object.assign({},p)}
function hasManualEdits(vIdx){
if(!S.edits)return false;
const ve=S.edits[vIdx];if(!ve)return false;
for(const s in ve){if(Object.keys(ve[s]||{}).length>0)return true}
return false}
/* ---------- rendering ---------- */
const FONT={Editorial:'font:700 1 "Instrument Sans",Georgia,serif;letter-spacing:-.03em',Minimalist:'font:400 1 "Instrument Sans",Inter,sans-serif;letter-spacing:-.015em',Experimental:'font:800 1 "Instrument Sans",Impact,sans-serif;letter-spacing:-.04em;text-transform:uppercase',Swiss:'font:700 1 "Instrument Sans",Helvetica,Arial,sans-serif;letter-spacing:-.035em;line-height:0.95'};
const fnt=(s,sz)=>(FONT[s]||FONT.Editorial).replace(' 1 ',` ${sz}cqw/1.02 `);
function bgPosterHtml(c,P,rng,img,vIdx,sIdx){
const bgOv=S.edits&&S.edits[vIdx]&&S.edits[vIdx][sIdx]&&S.edits[vIdx][sIdx].__bg;
if(img){

const keys=Object.keys(OPT);
const selects=keys.map(k=>`<label class="c">${CTL_LABELS[k]||k[0].toUpperCase()+k.slice(1)}<select data-c="${k}">${OPT[k].map(o=>`<option ${S.ctl[k]===o?'selected':''}>${o}</option>`).join('')}</select></label>`).join('');
const ovVal=typeof S.ctl.overlap==='number'?S.ctl.overlap:50;
const ovText=ovVal<=33?'Low':ovVal<=66?'Medium':'High';
const slider=`<label class="c">Element overlap (<span id="ov-label">${ovText}</span>)<input type="range" id="ov-slider" data-c="overlap" min="0" max="100" step="5" value="${ovVal}"></label>`;
$('#ct').innerHTML=selects+slider;
}
renderCreativeControls();

$('#ct').onchange=e=>{
const k=e.target.dataset.c;
if(k&&k!=='overlap'){
S.ctl[k]=e.target.value;
updateLive(`${CTL_LABELS[k]||k} set to "${e.target.value}"`);
}
};
$('#ct').oninput=e=>{
if(e.target.id==='ov-slider'){
const val=+e.target.value;
S.ctl.overlap=val;
const lbl=$('#ov-label');
if(lbl)lbl.textContent=val<=33?'Low':val<=66?'Medium':'High';
updateLive(`Overlap set to ${lbl?lbl.textContent:val}`);
}
};

$('#C').onclick=e=>{
const elTarget=e.target.closest('.el');
const slideTarget=e.target.closest('.slide');
const varTarget=e.target.closest('.var');
if(varTarget){
const vIdx=+varTarget.dataset.i;
if(vIdx!==S.sel){
S.sel=vIdx;S.selectedId=null;draw();renderProps();return}
}
if(slideTarget){
S.activeSlide=+slideTarget.dataset.s||0;
}
if(elTarget){
e.stopPropagation();
S.selectedId=elTarget.dataset.elId;
draw();renderProps();return}
S.selectedId=null;
draw();renderProps()};
function triggerRegen(){
if(hasManualEdits(S.sel)){
const m=$('#confirm-modal');
if(m)m.style.display='flex';
}else{
performRegen();
}}
function performRegen(){
if(S.edits&&S.edits[S.sel]){delete S.edits[S.sel]}
S.selectedId=null;
S.seed++;
gen()}
$('#regen').onclick=triggerRegen;
$('#modal-cancel').onclick=()=>{const m=$('#confirm-modal');if(m)m.style.display='none'};
$('#modal-confirm').onclick=()=>{const m=$('#confirm-modal');if(m)m.style.display='none';performRegen()};
$('#exp').onclick=async()=>{const v=S.vars[S.sel];if(!v)return;const d=JSON.stringify({format:S.fmt,controls:S.ctl,mode:S.mode,slides:v.sl,edits:S.edits[S.sel]},null,1);
try{const dl=await claude.use('downloads');if(!dl){$('#st').textContent='Export is unavailable in this view.';return}await dl.save({filename:'poster-spec.json',data:d});$('#st').textContent='Export requested.'}catch(e){$('#st').textContent='Export not completed.'}};
head();assets();gen();
</script></body></html>
